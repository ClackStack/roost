# Tests every push to main and every PR, on Linux only.
#
# The e2e job runs scripts/e2e.sh, which strace-traces the real binary to
# prove the "no outbound network calls" claim; strace is the only package
# the runner does not already have.

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      - run: make race

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install strace
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace
      - run: make e2e

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: install pnpm
        run: npm i -g pnpm@11.1.3
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run build
