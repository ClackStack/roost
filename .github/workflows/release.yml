# Publishes a GitHub Release when a `v*` tag is pushed.
#
# The same gates as ci.yml run first, so a tag can never publish untested
# code. Artifacts are Linux-only (amd64 + arm64); the platform list lives
# in PLATFORMS in the Makefile.
#
# Cut a release with:
#   git tag -a vX.Y.Z -m "..." && git push origin vX.Y.Z

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make test
      - run: make race

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: install strace
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends strace
      - run: make e2e

  publish:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: build release artifacts
        run: make release offline-bundle VERSION="${GITHUB_REF_NAME}"
      - name: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --title "${GITHUB_REF_NAME}" --generate-notes --verify-tag
