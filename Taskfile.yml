version: "3"

vars:
  DEFAULT_VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev
  VERSION: '{{or (env "VERSION") .DEFAULT_VERSION}}'
  LDFLAGS: "-s -w -X main.version={{.VERSION}}"
  PLATFORMS: "linux/amd64 linux/arm64"
  NFPM_VERSION: "v2.49.0"

tasks:
  default:
    desc: Build the roost binary
    cmds:
      - task: build

  build:
    desc: Build static ./roost binary
    cmds:
      - CGO_ENABLED=0 go build -trimpath -ldflags "{{.LDFLAGS}}" -o roost ./cmd/roost

  test:
    desc: Run go vet and unit tests
    cmds:
      - go vet ./...
      - go test ./...

  race:
    desc: Run tests with the race detector
    cmds:
      - go test -race ./...

  e2e:
    desc: Run real binary end-to-end checks under strace
    cmds:
      - scripts/e2e.sh

  fuzz:
    desc: Fuzz document extractors for 5m
    cmds:
      - go test ./internal/extract -run='^$' -fuzz=FuzzExtract -fuzztime=5m -fuzzminimizetime=5x

  release-binaries:
    desc: Cross-compile static release binaries into dist/
    cmds:
      - rm -rf dist && mkdir -p dist
      - |
        for p in {{.PLATFORMS}}; do
          os="${p%/*}"
          arch="${p#*/}"
          ext=""
          [ "$os" = "windows" ] && ext=".exe"
          echo "building $os/$arch"
          CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "{{.LDFLAGS}}" \
            -o "dist/roost-{{.VERSION}}-$os-$arch$ext" ./cmd/roost
        done
      - cd dist && rm -f SHA256SUMS && sha256sum roost* > SHA256SUMS

  packages:
    desc: Build .deb and .rpm packages from release binaries into dist/
    deps: [release-binaries]
    env:
      VERSION: "{{.VERSION}}"
      PLATFORMS: "{{.PLATFORMS}}"
      NFPM_VERSION: "{{.NFPM_VERSION}}"
    cmds:
      - scripts/package.sh

  package-test:
    desc: Test .deb and .rpm packages (structure and container apt/dnf repo install & upgrade)
    env:
      VERSION: "{{.VERSION}}"
      PLATFORMS: "{{.PLATFORMS}}"
      NFPM_VERSION: "{{.NFPM_VERSION}}"
    cmds:
      - scripts/test-packages.sh

  release:
    desc: Build release binaries, .deb and .rpm packages, and SHA256SUMS into dist/
    cmds:
      - task: packages

  # Source plus all dependencies, for building on a network with no module proxy:
  #   tar xzf roost-*-src.tar.gz && cd roost && go build -mod=vendor ./cmd/roost
  offline-bundle:
    desc: Package source with vendored dependencies into dist/
    cmds:
      - mkdir -p dist
      - go mod vendor
      - |
        tar czf "dist/roost-{{.VERSION}}-src.tar.gz" \
          --exclude=dist --exclude=.git --exclude=./roost --exclude=./roost.toml --exclude=./data \
          --exclude='*.test' --exclude='*.out' --exclude=.crush --exclude=.bunny --exclude=.impeccable \
          --exclude=website/node_modules --exclude=website/build --exclude=website/.svelte-kit \
          --transform 's,^\.,roost,' .
      - rm -rf vendor
      - cd dist && rm -f SHA256SUMS && sha256sum roost* > SHA256SUMS

  clean:
    desc: Remove build outputs and vendor directory
    cmds:
      - rm -rf roost dist vendor
